<h1>Tic Tac Toe</h1>

<button
  type="button"
  (click)="createTestGame()">
  Create Test Game
</button>

@if (game) {
  <h2>Game created successfully</h2>

  <p>Game ID: {{ game.gameId }}</p>
  <p>Mode: {{ game.mode }}</p>
  <p>Current Player: {{ game.currentPlayer }}</p>
  <p>Status: {{ game.status }}</p>
}

@if (errorMessage) {
  <p>{{ errorMessage }}</p>
}
